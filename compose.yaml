services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 3s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/assistant
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+psycopg://assistant:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/assistant
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
